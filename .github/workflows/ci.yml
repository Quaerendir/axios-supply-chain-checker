name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the documented minimum; official images guarantee it exists.
        python: ["3.8", "3.9", "3.12", "3.13"]
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run on the repo itself
        run: python axios_check.py . --no-global --json-out /tmp/out.json && python -c "import json; json.load(open('/tmp/out.json'))"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Syntax check
        run: bash -n check.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          severity: warning
